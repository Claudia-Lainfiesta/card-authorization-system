<div class="mercury-bg auth-scene flex items-center justify-center">
  <div class="auth-atmosphere" aria-hidden="true">
    <span class="blob-fluid"></span><span class="blob-fluid"></span><span class="blob-fluid"></span>
  </div>

  <div class="auth-panel w-full max-w-md">
    <div class="mb-8 text-center">
      <div class="auth-logo" aria-hidden="true"><span class="mercury-mark"></span></div>
      <p class="auth-eyebrow">MERCURY / SISTEMA DE TARJETAS</p>

      <h1 class="text-white">Crear cuenta</h1>

      <p class="mt-2 text-neutral-400">Regístrate como cliente</p>
    </div>

    @if (error) {
      <div class="mb-5 rounded-lg border border-red-800 bg-red-950 p-3 text-sm text-red-300">
        {{ error }}
      </div>
    }

    <form [formGroup]="formulario" (ngSubmit)="registrarse()" class="space-y-5">
      <div>
        <label class="mb-2 block text-sm font-medium text-neutral-300"> Nombre completo </label>

        <div class="form-group-container">
          <input
            type="text"
            formControlName="nombre_completo"
            placeholder="Nombre completo"
            class="w-full text-white"
          />
          <span class="input-glow-bar" aria-hidden="true"></span>
        </div>
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-neutral-300"> Correo electrónico </label>

        <div class="form-group-container">
          <input
            type="email"
            formControlName="correo"
            placeholder="correo@ejemplo.com"
            class="w-full text-white"
          />
          <span class="input-glow-bar" aria-hidden="true"></span>
        </div>
      </div>

      <div>
        <label class="mb-2 block text-sm font-medium text-neutral-300"> Contraseña </label>

        <div class="form-group-container">
          <input
            type="password"
            formControlName="password"
            placeholder="Mínimo 8 caracteres"
            class="w-full text-white"
          />
          <span class="input-glow-bar" aria-hidden="true"></span>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="cargando"
        class="mercury-button w-full px-4 py-3 font-semibold transition disabled:opacity-50"
      >
        @if (cargando) {
          Registrando...
        } @else {
          Crear cuenta
        }
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-400">
      ¿Ya tienes cuenta?

      <a routerLink="/login" class="font-medium text-neutral-300 hover:text-white">
        Iniciar sesión
      </a>
    </p>
  </div>
</div>

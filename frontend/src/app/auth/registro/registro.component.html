<div class="min-h-screen flex items-center justify-center px-4 py-10">

    <div
        class="w-full max-w-md rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl"
    >

        <div class="mb-8 text-center">

            <div
                class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-indigo-600 text-3xl"
            >
                💳
            </div>

            <h1
                class="text-3xl font-bold text-white"
            >
                Crear cuenta
            </h1>

            <p
                class="mt-2 text-slate-400"
            >
                Regístrate como cliente
            </p>

        </div>


        @if (error) {

            <div
                class="mb-5 rounded-lg border border-red-800 bg-red-950 p-3 text-sm text-red-300"
            >
                {{ error }}
            </div>

        }


        <form
            [formGroup]="formulario"
            (ngSubmit)="registrarse()"
            class="space-y-5"
        >

            <div>

                <label
                    class="mb-2 block text-sm font-medium text-slate-300"
                >
                    Nombre completo
                </label>

                <input
                    type="text"
                    formControlName="nombre_completo"
                    placeholder="Nombre completo"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-indigo-500"
                >

            </div>


            <div>

                <label
                    class="mb-2 block text-sm font-medium text-slate-300"
                >
                    Correo electrónico
                </label>

                <input
                    type="email"
                    formControlName="correo"
                    placeholder="correo@ejemplo.com"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-indigo-500"
                >

            </div>


            <div>

                <label
                    class="mb-2 block text-sm font-medium text-slate-300"
                >
                    Contraseña
                </label>

                <input
                    type="password"
                    formControlName="password"
                    placeholder="Mínimo 8 caracteres"
                    class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-white outline-none focus:border-indigo-500"
                >

            </div>


            <button
                type="submit"
                [disabled]="cargando"
                class="w-full rounded-lg bg-indigo-600 px-4 py-3 font-semibold text-white transition hover:bg-indigo-500 disabled:opacity-50"
            >

                @if (cargando) {
                    Registrando...
                } @else {
                    Crear cuenta
                }

            </button>

        </form>


        <p
            class="mt-6 text-center text-sm text-slate-400"
        >

            ¿Ya tienes cuenta?

            <a
                routerLink="/login"
                class="font-medium text-indigo-400 hover:text-indigo-300"
            >
                Iniciar sesión
            </a>

        </p>

    </div>

</div>
